name: release

# semantic-release decides the version from the commits on main, then the
# publish job ships that version.
#
# Publishing deliberately hangs off this run rather than off a tag push: a tag
# created with GITHUB_TOKEN does not start another workflow, so an `on: push:
# tags` publish job would never fire.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: raccooncore/blastdoor

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag, and commit the changelog
      issues: write # semantic-release comments on released issues
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads the whole history to find the last release.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets to the release
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag semantic-release just created, not the branch head.
          ref: v${{ needs.version.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # Attaches binaries and checksums to the release semantic-release made.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: echo "$DOCKER_PAT" | docker login -u raccooncore --password-stdin

      # A moving major tag (v1) is what the README and the GitLab template
      # tell people to pin to.
      - name: Work out the image tags
        id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "tags=${IMAGE}:${VERSION},${IMAGE}:v${VERSION%%.*},${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
